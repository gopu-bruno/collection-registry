name: build-index

on:
  push:
    branches: [main]
    paths:
      - 'collections/**'
  pull_request:
    paths:
      - 'collections/**'

permissions:
  contents: write

jobs:
  # On PRs: validate every entry parses and has the required fields.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/build-index.mjs --check

  # On merge to main: rebuild index.json from collections/ and commit it back.
  # The website fetches this file, so the new collection appears on the find page.
  rebuild:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/build-index.mjs
      - name: Commit regenerated index.json
        run: |
          git config user.name "registry-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.json
          git diff --staged --quiet || git commit -m "chore: rebuild index.json [skip ci]"
          git push
